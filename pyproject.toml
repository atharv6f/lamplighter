[project]
name = "lamplighter"
version = "0.1.0"
description = "An always-on personal agent that runs on a Mac."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "opentelemetry-proto==1.45.2",
]

[project.scripts]
lamplighter = "lamplighter.app.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "trustme>=1.2.1",
]

[tool.ruff]
# A task's files are data for the bench, and some are broken on purpose.
extend-exclude = ["bench/tasks"]

[tool.ruff.lint]
# E, F, UP, B, SIM and I are the set Ruff's own docs suggest as a start.
# C90 caps how tangled one function may get. D100, D101 and D103 ask for a
# docstring on every module, public class and public function.
select = ["E", "F", "UP", "B", "SIM", "I", "C90", "D100", "D101", "D103"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "live" call the real API and cost money, tests marked "crash"
# kill a process 200 times and take minutes, tests marked "sandbox" need
# macOS's sandbox-exec, tests marked "phoenix" start the pinned Phoenix,
# about 700 MB once installed, and tests marked "container" need Docker, so
# the default run leaves all five out. "-m live", "-m crash", "-m sandbox",
# "-m phoenix" or "-m container" on the command line runs them.
addopts = "-m 'not live and not crash and not sandbox and not phoenix and not container'"
markers = [
    "live: calls the real Anthropic API and needs ANTHROPIC_API_KEY",
    "crash: kills a process that writes to a real store, 200 times",
    "sandbox: runs commands behind the real wall and needs macOS's sandbox-exec",
    "phoenix: starts the pinned Phoenix through scripts/phoenix/start.sh",
    "container: runs commands in a Docker container of the pinned image",
]

[tool.importlinter]
root_package = "lamplighter"
# Needed for a rule that names a package from outside this repo.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not import adapters"
type = "forbidden"
source_modules = ["lamplighter.core"]
forbidden_modules = ["lamplighter.adapters"]

# Code two adapters share lives in a file at the adapters root, never in
# one adapter's package.
[[tool.importlinter.contracts]]
name = "no adapter imports another adapter's package"
type = "independence"
modules = [
    "lamplighter.adapters.anthropic",
    "lamplighter.adapters.builtin_tools",
    "lamplighter.adapters.container",
    "lamplighter.adapters.harbor_jobs",
    "lamplighter.adapters.in_memory",
    "lamplighter.adapters.phoenix",
    "lamplighter.adapters.seatbelt",
    "lamplighter.adapters.sqlite",
]

[[tool.importlinter.contracts]]
name = "only adapters and app use the HTTP library"
type = "forbidden"
source_modules = ["lamplighter.core", "lamplighter.ports"]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "only the span encoder uses OpenTelemetry's message classes"
type = "forbidden"
source_modules = ["lamplighter"]
forbidden_modules = ["opentelemetry", "google"]
ignore_imports = [
    "lamplighter.adapters.phoenix.otlp -> opentelemetry",
]

[[tool.importlinter.contracts]]
name = "core does not import the bench"
type = "forbidden"
source_modules = ["lamplighter.core"]
forbidden_modules = ["lamplighter.bench"]

[[tool.importlinter.contracts]]
name = "the bench's rules take plain values and import no other part"
type = "forbidden"
source_modules = ["lamplighter.bench"]
forbidden_modules = ["lamplighter.adapters", "lamplighter.app", "lamplighter.core"]

# Harbor is not installed in the harness's environment. Only the shim in
# bench/harbor imports it.
[[tool.importlinter.contracts]]
name = "nothing in the harness imports Harbor"
type = "forbidden"
source_modules = ["lamplighter"]
forbidden_modules = ["harbor"]
