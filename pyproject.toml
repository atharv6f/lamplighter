[project]
name = "lamplighter"
version = "0.1.0"
description = "An always-on personal agent that runs on a Mac."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.scripts]
lamplighter = "lamplighter.app.main:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
# E, F, UP, B, SIM and I are the set Ruff's own docs suggest as a start.
# C90 caps how tangled one function may get. D100, D101 and D103 ask for a
# docstring on every module, public class and public function.
select = ["E", "F", "UP", "B", "SIM", "I", "C90", "D100", "D101", "D103"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "lamplighter"
# Needed for a rule that names a package from outside this repo.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not import adapters"
type = "forbidden"
source_modules = ["lamplighter.core"]
forbidden_modules = ["lamplighter.adapters"]

[[tool.importlinter.contracts]]
name = "only adapters and app use the HTTP library"
type = "forbidden"
source_modules = ["lamplighter.core", "lamplighter.ports"]
forbidden_modules = ["httpx"]
