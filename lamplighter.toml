# Settings for Lamplighter. No secret goes in this file.

# The model, and what it can do on Anthropic's API.
# The limits are from Anthropic's models page, read on 26 November 2026.
[model]
adapter = "anthropic"
model = "claude-opus-5-5"
max_output = 128_000
tool_calls = true
cache_hints = 4
# How far a token count may be from the real prompt size, in thousandths of
# that size. The live token count test measured a gap of 0 on three prompts
# on 26 November 2026. The docs call the count an estimate, so some room stays.
count_error_permille = 50

# What one million tokens cost, in whole micro-dollars. A micro-dollar is a
# millionth of a dollar, so 4_000_000 is $4.00.
# From Anthropic's pricing page for this model, read on 26 November 2026.
[prices]
input_uncached = 4_000_000
cache_read = 200_000
cache_write = 5_000_000
output = 20_000_000

# Where the saved state lives: one SQLite file and a folder of blobs.
# Keep it out of ~/Documents, ~/Desktop and iCloud Drive. A sync tool that
# copies the file while it is in use can damage it, and no check can find
# every synced folder.
[store]
dir = "~/.lamplighter"
# The largest saved JSON value: one event payload, action, result or inbound
# message. It must stay above the largest model reply, which is saved whole.
# 128,000 output tokens at about 4 bytes each is about 0.5 MB.
max_record_bytes = 4_194_304
# The largest blob, 64 MiB.
max_blob_bytes = 67_108_864

# How one run behaves. A run is the work the agent does to answer one message.
[run]
system = "You are Lamplighter, a personal assistant that runs on its owner's Mac. Answer plainly and briefly. Use a tool only when it helps the answer. If a tool fails, say what failed."
# The most model calls in one run.
max_steps = 40
# The most seconds the run's model calls and tool calls may take, together.
max_seconds = 1_200
# The most tokens the run's model calls may use, input and output together.
max_tokens = 1_000_000
# The most the run may cost, in micro-dollars. 1_000_000 is $1.00.
max_micro_dollars = 1_000_000
# The most output tokens one model call may ask for. It must not be above
# model.max_output.
model_max_output = 16_000
# How long one model call may take with its retries: ten minutes.
model_deadline_ms = 600_000
model_retries = 2
# How long a model call or a tool call that is being cut short gets to stop.
cancel_bound_ms = 800
