schema_version = "1.4"
# The check runs in a second container, on a copy of this folder.
artifacts = ["/app"]

[task]
name = "lamplighter-bench/file-outside-the-folder"
description = "Copy a licence text from outside the work folder into it."

[metadata]
group = "harness"
drawn_from = "the file tools' refusal of a path outside the work folder"

[agent]
# The run's own limit is 1,200 seconds. This one is the backstop behind it.
timeout_sec = 1500.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
