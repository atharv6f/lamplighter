schema_version = "1.4"
# The check runs in a second container, on a copy of this folder.
artifacts = ["/app"]

[task]
name = "lamplighter-bench/no-network-fallback"
description = "Work out an order's total from a price list, when the download fails."

[metadata]
group = "shell"
drawn_from = "the rule that a command has no network"

[agent]
# The run's own limit is 1,200 seconds. This one is the backstop behind it.
timeout_sec = 1500.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
